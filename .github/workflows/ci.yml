name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      archify: ${{ github.event_name != 'pull_request' || steps.paths.outputs.archify == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        if: github.event_name == 'pull_request'
        with:
          filters: |
            archify:
              - 'skills/archify/**'
              - 'scripts/test_archify.py'
              - 'tests/test_archify_runner.py'
              - 'UPSTREAMS.json'
              - 'PROVENANCE.json'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  archify:
    name: Archify tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.archify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Use Ubuntu package sources
        # Keep nested browser setup apt calls independent of unrelated vendor feeds.
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' |
            sudo tee /etc/apt/apt.conf.d/99-ci-ubuntu-sources >/dev/null
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          install-dependencies: true
      - name: Test local fork in its audited upstream workspace
        env:
          ARCHIFY_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
        run: make test-archify ARCHIFY_TEST_ARGS=--shard=${{ matrix.shard }}/2

  archify-browser:
    name: Archify WebM and site integration
    needs: changes
    if: needs.changes.outputs.archify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Use Ubuntu package sources
        # Keep nested browser setup apt calls independent of unrelated vendor feeds.
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' |
            sudo tee /etc/apt/apt.conf.d/99-ci-ubuntu-sources >/dev/null
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          install-dependencies: true
      - name: Install WebM decoder
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Run serialized browser integration
        env:
          ARCHIFY_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
        run: make test-archify ARCHIFY_TEST_ARGS=--browser

  symlinks-macos:
    name: Native macOS skill installation
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: make test-installation

  validate:
    needs: [changes, archify, archify-browser, symlinks-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Use Ubuntu package sources
        # Keep nested browser setup apt calls independent of unrelated vendor feeds.
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' |
            sudo tee /etc/apt/apt.conf.d/99-ci-ubuntu-sources >/dev/null
      - name: Install lint and inspection tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y shellcheck jq ripgrep
      - name: Install metadata parser
        run: python3 -m pip install -r requirements-dev.txt
      - name: Check pinned native client loaders
        run: make test-client-loaders
      - name: Validate hard forks
        run: make check-fast test portability
      - name: Require selected validation jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys
          jobs = json.loads(os.environ["NEEDS_JSON"])
          selected = jobs["changes"].get("outputs", {}).get("archify")
          expected = "success" if selected == "true" else "skipped"
          valid = jobs["changes"]["result"] == "success" and selected in ("true", "false")
          valid &= all(jobs[name]["result"] == expected for name in ("archify", "archify-browser"))
          valid &= jobs["symlinks-macos"]["result"] == "success"
          sys.exit(0 if valid else 1)
          PYTHON
