labels:
  platform: linux/amd64
  backend: docker

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false

when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  - name: verify
    image: docker.io/library/node:22-trixie-slim@sha256:be1e2a3dc2c4fd68cdfadad2a696a280e0d2749098bee509230174d72fb768c6
    environment:
      DEBIAN_FRONTEND: noninteractive
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends make git python3 python3-venv shellcheck jq ripgrep
      - python3 -m venv /tmp/agent-skills-python
      - /tmp/agent-skills-python/bin/pip install -r requirements-dev.txt
      - export PATH=/tmp/agent-skills-python/bin:$PATH
      - make test-client-loaders
      - make check-fast test portability
