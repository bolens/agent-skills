labels:
  platform: linux/amd64
  backend: docker

depends_on:
  - portable

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false

when:
  - event: pull_request
    path:
      include:
        - 'skills/archify/**'
        - 'scripts/test_archify.py'
        - 'tests/test_archify_runner.py'
        - 'UPSTREAMS.json'
        - 'PROVENANCE.json'
        - 'Makefile'
        - '.github/workflows/ci.yml'
        - '.woodpecker/archify.yml'
        - 'scripts/wait-for-woodpecker.py'
        - 'tests/test_woodpecker_handoff.py'
        - 'tests/test_woodpecker_archify_selection.py'
  - event: push
    branch: main
  - event: manual

steps:
  - name: verify
    image: docker.io/library/node:22-trixie-slim@sha256:be1e2a3dc2c4fd68cdfadad2a696a280e0d2749098bee509230174d72fb768c6
    environment:
      DEBIAN_FRONTEND: noninteractive
      ARCHIFY_CHROME: /usr/bin/chromium
      ARCHIFY_CHROME_NO_SANDBOX: '1'
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates make git python3 zip unzip chromium fonts-liberation fonts-dejavu-core
      - node --version
      - python3 --version
      - chromium --version
      - test -x "$ARCHIFY_CHROME"
      - make test-archify
